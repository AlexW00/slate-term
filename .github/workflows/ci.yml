name: CI

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source and release-tooling checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Scan source and complete fetched history
        run: python3 scripts/security-scan.py
      - name: Check release tooling
        run: python3 -m unittest discover -s Tests/Release -v
      - name: Check verification inventory
        run: python3 -m unittest discover -s Tests/VMRunner -v
      - name: Check shell syntax
        run: |
          bash -n scripts/setup-metal-ci.sh
          bash -n scripts/build-ghostty.sh
          bash -n scripts/release-build.sh
          bash -n scripts/release-package.sh
      - name: Check workflow syntax
        run: python3 scripts/check-workflows.py

  macos:
    name: Apple Silicon build and package tests
    needs: source
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Ensure Metal compiler is available
        run: bash scripts/setup-metal-ci.sh
      - name: Toolchain
        id: toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version
          echo "build=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore pinned engine inputs
        id: engine-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .tools/zig-*
            .build/bootstrap
          key: ghostty-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.build }}-${{ hashFiles('scripts/build-ghostty.sh', 'patches/**') }}
      - name: Package unit tests
        run: swift test --jobs 4 --only-use-versions-from-resolved-file
      - name: Build pinned engine
        run: bash scripts/build-ghostty.sh
      - name: Save validated engine inputs
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .tools/zig-*
            .build/bootstrap
          key: ${{ steps.engine-cache.outputs.cache-primary-key }}
      - name: Build unsigned Release app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/release-build.sh --version 0.0.0 --build-number "$BUILD_NUMBER"
      - name: Exercise distribution packaging without credentials
        run: bash scripts/release-package.sh --unsigned
      - name: Verify packaged asset checksums
        working-directory: artifacts/release/assets
        run: shasum -a 256 -c SHA256SUMS
