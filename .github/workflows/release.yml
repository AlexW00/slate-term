name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag on main, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and default-branch ancestry
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/release-metadata.py --tag "$RELEASE_TAG" --default-branch "$DEFAULT_BRANCH"
      - name: Scan source and all fetched history
        run: python3 scripts/security-scan.py
      - name: Check release tooling
        run: python3 -m unittest discover -s Tests/Release -v
      - name: Check workflow syntax
        run: python3 scripts/check-workflows.py

  build:
    name: Build, sign, and notarize
    needs: validate
    runs-on: xcode-27
    environment: release
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test packages
        run: swift test --jobs 4 --only-use-versions-from-resolved-file
      - name: Build pinned engine
        run: bash scripts/build-ghostty.sh
      - name: Build unsigned app
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/release-build.sh --version "$RELEASE_VERSION" --build-number "$BUILD_NUMBER"
      - name: Package corresponding source before loading credentials
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: python3 scripts/release-source.py --output artifacts/release/assets --version "$RELEASE_VERSION" --build-number "$BUILD_NUMBER"
      - name: Sign and notarize using an isolated temporary keychain
        env:
          SLATE_RELEASE_CERTIFICATE_P12_BASE64: ${{ secrets.SLATE_RELEASE_CERTIFICATE_P12_BASE64 }}
          SLATE_RELEASE_CERTIFICATE_PASSWORD: ${{ secrets.SLATE_RELEASE_CERTIFICATE_PASSWORD }}
          SLATE_NOTARY_KEY_P8_BASE64: ${{ secrets.SLATE_NOTARY_KEY_P8_BASE64 }}
          SLATE_NOTARY_KEY_ID: ${{ secrets.SLATE_NOTARY_KEY_ID }}
          SLATE_NOTARY_ISSUER_ID: ${{ secrets.SLATE_NOTARY_ISSUER_ID }}
        run: python3 scripts/release-with-credentials.py --from-environment -- bash scripts/release-package.sh
      - name: Checksum every distributable
        working-directory: artifacts/release/assets
        run: |
          shasum -a 256 ./*.zip ./*.dmg ./*-source.tar.gz > SHA256SUMS
          shasum -a 256 -c SHA256SUMS
      - name: Retain verified distributables
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-assets
          path: |
            artifacts/release/assets/*.zip
            artifacts/release/assets/*.dmg
            artifacts/release/assets/*-source.tar.gz
            artifacts/release/assets/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  draft:
    name: Create draft GitHub release
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-assets
          path: assets
      - name: Verify downloaded assets
        working-directory: assets
        run: sha256sum -c SHA256SUMS
      - name: Create a reviewable draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          actual_commit="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)"
          test "$actual_commit" = "$EXPECTED_COMMIT" || { echo "Release tag moved during the build." >&2; exit 1; }
          gh release create "$RELEASE_TAG" assets/*.zip assets/*.dmg assets/*-source.tar.gz assets/SHA256SUMS \
            --draft --verify-tag --title "Slate Terminal $RELEASE_VERSION" --generate-notes
