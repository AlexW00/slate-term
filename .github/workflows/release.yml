name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and default-branch ancestry
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/release-metadata.py --tag "$RELEASE_TAG" --default-branch "$DEFAULT_BRANCH"
      - name: Validate reviewed release notes
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: python3 scripts/release-updates.py validate-notes --notes "docs/releases/$RELEASE_TAG.md"
      - name: Scan source and all fetched history
        run: python3 scripts/security-scan.py
      - name: Check release tooling
        run: python3 -m unittest discover -s Tests/Release -v
      - name: Check workflow syntax
        run: python3 scripts/check-workflows.py

  build:
    name: Build, sign, and notarize
    needs: validate
    runs-on: xcode-27
    environment: release
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate public update configuration before building
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_FEED_URL: ${{ vars.SPARKLE_FEED_URL }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/release-updates.py validate-public-config --repository "$RELEASE_REPOSITORY"
      - name: Ensure Metal compiler is available
        run: bash scripts/setup-metal-ci.sh
      - name: Toolchain
        id: toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version
          echo "build=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore pinned engine inputs
        id: engine-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/zig-*
            .build/bootstrap
          key: ghostty-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.build }}-${{ hashFiles('scripts/build-ghostty.sh', 'patches/**') }}
      - name: Test packages
        run: swift test --jobs 4 --only-use-versions-from-resolved-file
      - name: Build pinned engine
        run: bash scripts/build-ghostty.sh
      - name: Save validated engine inputs
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .tools/zig-*
            .build/bootstrap
          key: ${{ steps.engine-cache.outputs.cache-primary-key }}
      - name: Build unsigned app
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_FEED_URL: ${{ vars.SPARKLE_FEED_URL }}
        run: bash scripts/release-build.sh --version "$RELEASE_VERSION" --build-number "$BUILD_NUMBER"
      - name: Check built app update configuration
        run: python3 scripts/release-updates.py validate-config --app 'artifacts/release/Slate Terminal.app'
      - name: Package corresponding source before loading credentials
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: python3 scripts/release-source.py --output artifacts/release/assets --version "$RELEASE_VERSION" --build-number "$BUILD_NUMBER"
      - name: Fetch checksum-pinned Sparkle release tools
        run: python3 scripts/release-updates.py bootstrap-tools --output .build/sparkle-tools
      - name: Verify official Sparkle tools with public test vectors
        env:
          SLATE_TEST_SPARKLE_TOOLS: ${{ github.workspace }}/.build/sparkle-tools
        run: python3 -m unittest discover -s Tests/Release -p test_update_tools.py -v
      - name: Sign and notarize using an isolated temporary keychain
        env:
          SLATE_RELEASE_CERTIFICATE_P12_BASE64: ${{ secrets.SLATE_RELEASE_CERTIFICATE_P12_BASE64 }}
          SLATE_RELEASE_CERTIFICATE_PASSWORD: ${{ secrets.SLATE_RELEASE_CERTIFICATE_PASSWORD }}
          SLATE_NOTARY_KEY_P8_BASE64: ${{ secrets.SLATE_NOTARY_KEY_P8_BASE64 }}
          SLATE_NOTARY_KEY_ID: ${{ secrets.SLATE_NOTARY_KEY_ID }}
          SLATE_NOTARY_ISSUER_ID: ${{ secrets.SLATE_NOTARY_ISSUER_ID }}
        run: python3 scripts/release-with-credentials.py --from-environment -- bash scripts/release-package.sh
      - name: Prepare signed update assets for the draft
        env:
          SLATE_SPARKLE_PRIVATE_KEY: ${{ secrets.SLATE_SPARKLE_PRIVATE_KEY }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/release-updates.py prepare --tools .build/sparkle-tools \
            --app 'artifacts/release/Slate Terminal.app' --assets artifacts/release/assets \
            --notes "docs/releases/$RELEASE_TAG.md" --repository "$RELEASE_REPOSITORY"
      - name: Provide stable installer download
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        working-directory: artifacts/release/assets
        run: cp "Slate-Terminal-$RELEASE_VERSION-$BUILD_NUMBER-arm64.dmg" Slate-Terminal-arm64.dmg
      - name: Checksum every distributable
        working-directory: artifacts/release/assets
        run: |
          shasum -a 256 ./*.zip ./*.dmg ./*-source.tar.gz ./appcast.xml ./*-arm64.md > SHA256SUMS
          shasum -a 256 -c SHA256SUMS
      - name: Retain verified distributables
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-assets
          path: |
            artifacts/release/assets/*.zip
            artifacts/release/assets/*.dmg
            artifacts/release/assets/*-source.tar.gz
            artifacts/release/assets/SHA256SUMS
            artifacts/release/assets/appcast.xml
            artifacts/release/assets/*-arm64.md
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  draft:
    name: Create draft GitHub release
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-assets
          path: assets
      - name: Verify downloaded assets
        working-directory: assets
        run: sha256sum -c SHA256SUMS
      - name: Create a reviewable draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          actual_commit="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)"
          test "$actual_commit" = "$EXPECTED_COMMIT" || { echo "Release tag moved during the build." >&2; exit 1; }
          notes=(assets/*-arm64.md)
          if [[ "${#notes[@]}" -ne 1 || ! -s "${notes[0]}" ]]; then
            echo "Expected one reviewed release notes asset." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" assets/*.zip assets/*.dmg assets/*-source.tar.gz assets/SHA256SUMS assets/appcast.xml assets/*-arm64.md \
            --draft --verify-tag --title "Slate Terminal $RELEASE_VERSION" --notes-file "${notes[0]}"
