				"  # Nested code must be signed before Xcode signs the app bundle.",
				"  if [ \"${CODE_SIGNING_ALLOWED:-NO}\" = YES ]; then",
				"    codesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY:--}\" --timestamp=none \"$staging/$tool\"",
				"  fi",
				"  cp -f \"$staging/$tool\" \"$helpers/$tool\"",
				"done",
