<!--
name: Confirmation dialog
summary: Small modal for destructive or irreversible actions, using the native dialog element.
use: Confirming an action that cannot be undone, or one short required input.
avoid: Confirming reversible actions (offer undo instead). Long forms in dialogs. Dialogs that open on page load.
notes: Title states the action as a question. Buttons repeat the verb; the safe choice is the default focus.
preview-height: 200
preview-padding: true
-->
<style>
  .st-dialog {
    width: min(340px, calc(100vw - 32px)); padding: 0;
    border: 0; border-radius: 12px;
    background: var(--surface-raised); color: var(--text);
    box-shadow: var(--shadow-popover);
  }
  .st-dialog::backdrop { background: rgb(0 0 0 / 0.28); }
  .st-dialog[open] { animation: st-dialog-in 180ms var(--ease-out); }
  @keyframes st-dialog-in { from { opacity: 0; transform: scale(0.97); } }
  .st-dialog-body { padding: var(--space-4) var(--space-4) var(--space-3); }
  .st-dialog-body h2 { font-size: var(--text-base); }
  .st-dialog-body p { margin-top: 6px; font-size: var(--text-md); color: var(--text-secondary); }
  .st-dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); padding: 0 var(--space-4) var(--space-4); }
</style>

<button class="st-button is-danger" onclick="document.getElementById('st-demo-dialog').showModal()">Delete Branch…</button>
<dialog class="st-dialog" id="st-demo-dialog" aria-labelledby="st-demo-dialog-title">
  <form method="dialog">
    <div class="st-dialog-body">
      <h2 id="st-demo-dialog-title">Delete “fix/pane-drag-preview”?</h2>
      <p>It has 3 commits that are not on main.</p>
    </div>
    <div class="st-dialog-actions">
      <button class="st-button" value="cancel" autofocus>Cancel</button>
      <button class="st-button is-danger" value="delete">Delete</button>
    </div>
  </form>
</dialog>
