<!--
name: Outline
summary: Expandable tree of single-line rows with disclosure chevrons, like Finder's list view.
use: Nested data people expand and pick from: files, symbols, test suites, settings groups.
avoid: Flat data (use List). More than about five levels. Several fields per row (use Table).
notes: Indent is 14px per level via --st-outline-indent. Collapse all descendants with Option-click on a chevron.
script: Arrow keys move and expand; Left goes to the parent; Return dispatches "open". Keep keyboard support when adapting.
-->
<style>
  .st-outline { --st-outline-indent: 14px; display: flex; flex-direction: column; padding: var(--space-1); outline: none; }
  .st-outline [role=group] { display: flex; flex-direction: column; }
  .st-outline [aria-expanded="false"] > [role=group] { display: none; }
  .st-outline-row {
    --st-outline-depth: 0;
    display: flex; align-items: center; gap: 6px;
    height: var(--row-height);
    padding: 0 10px 0 calc(4px + var(--st-outline-depth) * var(--st-outline-indent));
    border-radius: var(--radius);
  }
  .st-outline [aria-level="2"] > .st-outline-row { --st-outline-depth: 1; }
  .st-outline [aria-level="3"] > .st-outline-row { --st-outline-depth: 2; }
  .st-outline [aria-level="4"] > .st-outline-row { --st-outline-depth: 3; }
  .st-outline [aria-level="5"] > .st-outline-row { --st-outline-depth: 4; }
  .st-outline-row:hover { background: var(--fill); }
  [aria-selected="true"] > .st-outline-row { background: var(--accent-tint); }
  .st-outline:focus-visible [aria-selected="true"] > .st-outline-row { box-shadow: inset 0 0 0 1px var(--focus-ring); }
  .st-outline-toggle {
    display: grid; place-items: center; flex: none;
    width: 14px; height: 14px;
    color: var(--text-tertiary);
  }
  .st-outline-toggle .st-icon { width: 10px; height: 10px; stroke-width: 2; transition: transform 120ms var(--ease-out); }
  [aria-expanded="true"] > .st-outline-row .st-outline-toggle .st-icon { transform: rotate(90deg); }
  .st-outline-row > .st-icon { color: var(--text-secondary); }
  [aria-selected="true"] > .st-outline-row > .st-icon { color: var(--accent); }
  .st-outline-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .st-outline-trailing { flex: none; font-size: var(--text-sm); color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
  .st-outline-trailing.is-modified { color: var(--warning); font-weight: 600; }
  .st-outline-trailing.is-added { color: var(--success); font-weight: 600; }
</style>

<div class="st-outline" role="tree" tabindex="0" aria-label="Files">
  <div role="treeitem" aria-level="1" aria-expanded="true" aria-selected="false">
    <div class="st-outline-row">
      <span class="st-outline-toggle"><svg class="st-icon" viewBox="0 0 10 10"><path d="m3.5 2 3 3-3 3"/></svg></span>
      <svg class="st-icon" viewBox="0 0 16 16"><path d="M2 4.5c0-.6.4-1 1-1h3l1.5 1.5H13c.6 0 1 .4 1 1V12c0 .6-.4 1-1 1H3c-.6 0-1-.4-1-1z"/></svg>
      <span class="st-outline-name">Sources</span>
      <span class="st-outline-trailing">4</span>
    </div>
    <div role="group">
      <div role="treeitem" aria-level="2" aria-expanded="true" aria-selected="false">
        <div class="st-outline-row">
          <span class="st-outline-toggle"><svg class="st-icon" viewBox="0 0 10 10"><path d="m3.5 2 3 3-3 3"/></svg></span>
          <svg class="st-icon" viewBox="0 0 16 16"><path d="M2 4.5c0-.6.4-1 1-1h3l1.5 1.5H13c.6 0 1 .4 1 1V12c0 .6-.4 1-1 1H3c-.6 0-1-.4-1-1z"/></svg>
          <span class="st-outline-name">Panes</span>
          <span class="st-outline-trailing">2</span>
        </div>
        <div role="group">
          <div role="treeitem" aria-level="3" aria-selected="true">
            <div class="st-outline-row">
              <span class="st-outline-toggle"></span>
              <svg class="st-icon" viewBox="0 0 16 16"><path d="M4 2h5l3 3v9H4zM9 2v3h3"/></svg>
              <span class="st-outline-name">PaneSplitController.swift</span>
              <span class="st-outline-trailing is-modified" title="Modified">M</span>
            </div>
          </div>
          <div role="treeitem" aria-level="3" aria-selected="false">
            <div class="st-outline-row">
              <span class="st-outline-toggle"></span>
              <svg class="st-icon" viewBox="0 0 16 16"><path d="M4 2h5l3 3v9H4zM9 2v3h3"/></svg>
              <span class="st-outline-name">PaneDragPreview.swift</span>
              <span class="st-outline-trailing is-added" title="Added">A</span>
            </div>
          </div>
        </div>
      </div>
      <div role="treeitem" aria-level="2" aria-expanded="false" aria-selected="false">
        <div class="st-outline-row">
          <span class="st-outline-toggle"><svg class="st-icon" viewBox="0 0 10 10"><path d="m3.5 2 3 3-3 3"/></svg></span>
          <svg class="st-icon" viewBox="0 0 16 16"><path d="M2 4.5c0-.6.4-1 1-1h3l1.5 1.5H13c.6 0 1 .4 1 1V12c0 .6-.4 1-1 1H3c-.6 0-1-.4-1-1z"/></svg>
          <span class="st-outline-name">Plugins</span>
          <span class="st-outline-trailing">2</span>
        </div>
        <div role="group">
          <div role="treeitem" aria-level="3" aria-selected="false">
            <div class="st-outline-row">
              <span class="st-outline-toggle"></span>
              <svg class="st-icon" viewBox="0 0 16 16"><path d="M4 2h5l3 3v9H4zM9 2v3h3"/></svg>
              <span class="st-outline-name">PluginHost.swift</span>
            </div>
          </div>
          <div role="treeitem" aria-level="3" aria-selected="false">
            <div class="st-outline-row">
              <span class="st-outline-toggle"></span>
              <svg class="st-icon" viewBox="0 0 16 16"><path d="M4 2h5l3 3v9H4zM9 2v3h3"/></svg>
              <span class="st-outline-name">PluginBridge.swift</span>
            </div>
          </div>
        </div>
      </div>
      <div role="treeitem" aria-level="2" aria-selected="false">
        <div class="st-outline-row">
          <span class="st-outline-toggle"></span>
          <svg class="st-icon" viewBox="0 0 16 16"><path d="M4 2h5l3 3v9H4zM9 2v3h3"/></svg>
          <span class="st-outline-name">AppDelegate.swift</span>
        </div>
      </div>
    </div>
  </div>
  <div role="treeitem" aria-level="1" aria-selected="false">
    <div class="st-outline-row">
      <span class="st-outline-toggle"></span>
      <svg class="st-icon" viewBox="0 0 16 16"><path d="M4 2h5l3 3v9H4zM9 2v3h3"/></svg>
      <span class="st-outline-name">Package.swift</span>
    </div>
  </div>
</div>

<script>
  document.querySelectorAll(".st-outline[role=tree]").forEach(tree => {
    const items = () => [...tree.querySelectorAll("[role=treeitem]")];
    // Items inside a collapsed folder are not reachable.
    const visible = () => items().filter(item => !item.parentElement.closest("[role=treeitem][aria-expanded=false]"));
    const parentOf = item => item.parentElement.closest("[role=treeitem]");
    const selected = () => tree.querySelector("[role=treeitem][aria-selected=true]");
    const select = item => {
      if (!item) return;
      items().forEach(other => other.setAttribute("aria-selected", String(other === item)));
      item.firstElementChild.scrollIntoView({ block: "nearest" });
    };
    const setExpanded = (item, open, deep) => {
      const folders = deep ? [item, ...item.querySelectorAll("[role=treeitem][aria-expanded]")] : [item];
      folders.forEach(folder => folder.setAttribute("aria-expanded", String(open)));
      // Keep the selection visible when its folder closes.
      if (!open && item.querySelector("[aria-selected=true]")) select(item);
    };

    tree.addEventListener("click", event => {
      const item = event.target.closest("[role=treeitem]");
      if (!item) return;
      if (event.target.closest(".st-outline-toggle") && item.hasAttribute("aria-expanded")) {
        setExpanded(item, item.getAttribute("aria-expanded") !== "true", event.altKey);
      } else {
        select(item);
      }
    });

    tree.addEventListener("keydown", event => {
      const all = visible();
      const current = selected();
      const index = all.indexOf(current);
      const expanded = current?.getAttribute("aria-expanded");
      if (event.key === "ArrowDown") select(all[Math.min(index + 1, all.length - 1)]);
      else if (event.key === "ArrowUp") select(all[Math.max(index - 1, 0)]);
      else if (event.key === "Home") select(all[0]);
      else if (event.key === "End") select(all[all.length - 1]);
      else if (event.key === "ArrowRight") {
        if (expanded === "false") setExpanded(current, true, event.altKey);
        else if (expanded === "true") select(current.querySelector("[role=treeitem]"));
      } else if (event.key === "ArrowLeft") {
        if (expanded === "true") setExpanded(current, false, event.altKey);
        else select(current && parentOf(current));
      } else if (event.key === "Enter") current?.dispatchEvent(new CustomEvent("open", { bubbles: true }));
      else return;
      event.preventDefault();
    });
  });
</script>
