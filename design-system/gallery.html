>\n  .st-log {\n    margin: 0; padding: var(--space-2) var(--space-3);\n    font: var(--st-font-mono-size)/1.55 var(--font-mono);\n    color: var(--text);\n    white-space: pre-wrap; overflow-wrap: anywhere;\n    overflow: auto; tab-size: 4;\n  }\n  .st-log .t { color: var(--text-tertiary); }\n  .st-log .info { color: var(--st-ansi-6); }\n  .st-log .ok { color: var(--st-ansi-2); }\n  .st-log .warn { color: var(--st-ansi-3); }\n  .st-log .err { color: var(--st-ansi-1); }\n  .st-log.is-boxed { border-radius: var(--radius); background: var(--surface); box-shadow: inset 0 0 0 1px var(--separator); }\n\n  /* Follow variant: give .st-log-follow a height, usually by making it the pane's content area. */\n  .st-log-follow { position: relative; min-height: 0; }\n  .st-log-follow > .st-log { height: 100%; }\n  .st-log-jump {\n    position: absolute; bottom: var(--space-2); left: 50%; transform: translateX(-50%);\n    display: inline-flex; align-items: center; gap: 5px;\n    height: 22px; padding: 0 10px;\n    border: 0; border-radius: 11px;\n    background: var(--surface-raised); color: var(--text);\n    box-shadow: var(--shadow-popover);\n    font: 500 var(--text-sm)/1 var(--font-ui); white-space: nowrap;\n  }\n  .st-log-jump:hover { background: color-mix(in oklab, var(--st-fg) 10%, var(--surface-raised)); }\n  .st-log-jump .st-icon { width: 12px; height: 12px; }\n  .st-log-jump b { font-weight: 500; color: var(--accent); font-variant-numeric: tabular-nums; }\n<\/style>\n\n<pre class=\"st-log is-boxed\"><span class=\"t\">14:02:11<\/span> <span class=\"info\">info<\/span>  vite v6.2.0 dev server running\n<span class=\"t\">14:02:11<\/span> <span class=\"info\">info<\/span>  Local: http://127.0.0.1:5173/\n<span class=\"t\">14:02:19<\/span> <span class=\"ok\">ok<\/span>    hmr update /src/App.tsx\n<span class=\"t\">14:02:31<\/span> <span class=\"warn\">warn<\/span>  Large chunk: index-8f2a.js (612 kB)\n<span class=\"t\">14:02:44<\/span> <span class=\"err\">error<\/span> Cannot find module './theme'<\/pre>\n\n<div class=\"st-log-follow\" style=\"height: 160px; margin-top: var(--space-3)\">\n  <div class=\"st-log is-boxed\" role=\"log\" aria-label=\"Build output\" tabindex=\"0\"><\/div>\n  <button class=\"st-log-jump\" hidden>\n    <svg class=\"st-icon\" viewBox=\"0 0 16 16\"><path d=\"M8 3v10M4 9l4 4 4-4\"/><\/svg>Jump to Latest<b><\/b>\n  <\/button>\n<\/div>\n\n<script>\n  // Returns append(line). Lines are elements, such as a div with the colored spans above.\n  function followLog(root, maxLines = 5000) {\n    const log = root.querySelector(\".st-log\");\n    const jump = root.querySelector(\".st-log-jump\");\n    let following = true, unseen = 0;\n    const update = () => {\n      jump.hidden = following;\n      jump.querySelector(\"b\").textContent = unseen ? `${unseen.toLocaleString()} new` : \"\";\n    };\n    const toBottom = () => { log.scrollTop = log.scrollHeight; };\n    log.addEventListener(\"scroll\", () => {\n      following = log.scrollHeight - log.scrollTop - log.clientHeight < 4;\n      if (following) unseen = 0;\n      update();\n    });\n    jump.addEventListener(\"click\", () => { toBottom(); following = true; unseen = 0; update(); });\n    return line => {\n      const before = log.scrollHeight;\n      log.append(line);\n      const added = log.scrollHeight - before;\n      while (log.childElementCount > maxLines) log.firstElementChild.remove();\n      if (following) return toBottom();\n      // Dropping old lines shifts content up; keep the user's place.\n      log.scrollTop -= before + added - log.scrollHeight;\n      unseen++;\n      update();\n    };\n  }\n\n  // Demo only: appends a fake build line every 1.5s.\n  {\n    const append = followLog(document.querySelector(\".st-log-follow\"));\n    const messages = [\"compiled src/App.tsx\", \"hmr update /src/theme.css\", \"rebuilt 14 modules in 212 ms\", \"Large chunk: vendor.js (540 kB)\"];\n    let n = 0;\n    const line = () => {\n      const [cls, label] = n % 4 === 3 ? [\"warn\", \"warn \"] : n % 2 ? [\"ok\", \"ok   \"] : [\"info\", \"info \"];\n      const row = document.createElement(\"div\");\n      row.innerHTML = `<span class=\"t\">${new Date().toLocaleTimeString([], { hour12: false })}<\/span> <span class=\"${cls}\">${label}<\/span>`;\n      row.append(messages[n++ % messages.length]);\n      append(row);\n    };\n    for (let i = 0; i < 12; i++) line();\n    setInterval(line, 1500);\n  }\n<\/script>\n", "path": "components/patterns/log-output.html", "id": "log-output"}, {"name": "Master-detail", "summary": "List beside a detail view when wide; the list alone with push navigation when narrow.", "use": "Browsing items that each have a larger detail view.", "avoid": "Fixed sidebars in narrow panes. Three columns.", "notes": "Uses a container query, so it adapts to the pane, not the window. Width 560px is the switch point.", "script": "Selecting an item sets data-showing=\"detail\"; Back clears it. Only matters when narrow.", "body": "<style>\n  .st-md { container-type: inline-size; height: 260px; }\n  .st-md-inner { display: grid; grid-template-columns: minmax(180px, 34%) 1fr; height: 100%; }\n  .st-md-sidebar { overflow: auto; border-right: 1px solid var(--separator); }\n  .st-md-detail { overflow: auto; padding: var(--space-4); }\n  .st-md-back { display: none; }\n  .st-md-item { display: block; width: 100%; padding: 7px 10px; border: 0; border-radius: var(--radius); background: none; color: inherit; font: inherit; text-align: left; }\n  .st-md-item:hover { background: var(--fill); }\n  .st-md-item[aria-current=\"true\"] { background: var(--accent-tint); }\n  .st-md-sidebar nav { padding: var(--space-1); }\n  @container (max-width: 560px) {\n    .st-md-inner { grid-template-columns: 1fr; }\n    .st-md-sidebar { border-right: 0; }\n    .st-md-inner[data-showing=\"detail\"] .st-md-sidebar,\n    .st-md-inner:not([data-showing=\"detail\"]) .st-md-detail { display: none; }\n    .st-md-back { display: inline-flex; margin: 0 0 var(--space-3) -6px; }\n  }\n<\/style>\n\n<div class=\"st-md\">\n  <div class=\"st-md-inner\">\n    <aside class=\"st-md-sidebar\">\n      <nav>\n        <button class=\"st-md-item\" aria-current=\"true\">deploy.yml<\/button>\n        <button class=\"st-md-item\">test.yml<\/button>\n        <button class=\"st-md-item\">release.yml<\/button>\n      <\/nav>\n    <\/aside>\n    <section class=\"st-md-detail\">\n      <button class=\"st-button is-plain is-small st-md-back\">\n        <svg class=\"st-icon\" viewBox=\"0 0 16 16\"><path d=\"M10 3 5 8l5 5\"/><\/svg>Workflows\n      <\/button>\n      <h1>deploy.yml<\/h1>\n      <p class=\"st-secondary\" style=\"margin-top:4px\">Runs on push to main \u00b7 last run 4m ago<\/p>\n    <\/section>\n  <\/div>\n<\/div>\n\n<script>\n  document.querySelectorAll(\".st-md-inner\").forEach(root => {\n    root.addEventListener(\"click\", event => {\n      const item = event.target.closest(\".st-md-item\");\n      if (item) {\n        root.querySelectorAll(\".st-md-item\").forEach(other => {\n          if (other === item) other.setAttribute(\"aria-current\", \"true\");\n          else other.removeAttribute(\"aria-current\");\n        });\n        root.querySelector(\".st-md-detail h1\").textContent = item.textContent;\n        root.dataset.showing = \"detail\";\n      }\n      if (event.target.closest(\".st-md-back\")) delete root.dataset.showing;\n    });\n  });\n<\/script>\n", "path": "components/patterns/master-detail.html", "id": "master-detail"}, {"name": "Menu", "summary": "Popover menu anchored to a button, using the native popover attribute.", "use": "Secondary actions behind a \"More\" button or a row's context menu.", "avoid": "Primary actions only reachable here. Nested submenus. Menus for two items.", "notes": "Opens instantly; frequent menus do not animate. Escape and outside clicks close it natively.", "script": "Positions the menu under its trigger and adds arrow-key navigation.", "preview-height": "230", "preview-padding": "true", "body": "<style>\n  .st-menu {\n    margin: 0; padding: var(--space-1);\n    min-width: 180px;\n    border: 0; border-radius: var(--radius-lg);\n    background: var(--surface-raised);\n    color: var(--text);\n    box-shadow: var(--shadow-popover);\n    font-size: var(--text-base);\n  }\n  .st-menu-item {\n    display: flex; align-items: center; gap: var(--space-2);\n    width: 100%; height: 24px; padding: 0 var(--space-2);\n    border: 0; border-radius: var(--radius-sm);\n    background: none; color: inherit; font: inherit; text-align: left;\n  }\n  .st-menu-item:hover, .st-menu-item:focus-visible { background: var(--accent); color: var(--on-accent); outline: none; }\n  .st-menu-item .st-icon { width: 14px; height: 14px; }\n  .st-menu-item kbd { margin-left: auto; padding-left: var(--space-4); font: inherit; opacity: 0.6; }\n  .st-menu-item.is-danger { color: var(--danger); }\n  .st-menu-item.is-danger:hover { background: var(--danger); color: var(--on-accent); }\n  .st-menu-separator { height: 1px; margin: var(--space-1) var(--space-2); background: var(--separator); }\n<\/style>\n\n<button class=\"st-button\" popovertarget=\"st-demo-menu\">Actions<\/button>\n<div class=\"st-menu\" id=\"st-demo-menu\" popover role=\"menu\">\n  <button class=\"st-menu-item\" role=\"menuitem\">Open in Terminal<kbd>\u2318O<\/kbd><\/button>\n  <button class=\"st-menu-item\" role=\"menuitem\">Copy Path<kbd>\u2325\u2318C<\/kbd><\/button>\n  <button class=\"st-menu-item\" role=\"menuitem\">Rename\u2026<\/button>\n  <div class=\"st-menu-separator\" role=\"separator\"><\/div>\n  <button class=\"st-menu-item is-danger\" role=\"menuitem\">Delete Branch<\/button>\n<\/div>\n\n<script>\n  document.querySelectorAll(\".st-menu[popover]\").forEach(menu => {\n    menu.addEventListener(\"toggle\", event => {\n      if (event.newState !== \"open\") return;\n      const trigger = document.querySelector(`[popovertarget=\"${menu.id}\"]`);\n      if (!trigger) return;\n      const anchor = trigger.getBoundingClientRect();\n      const left = Math.min(anchor.left, innerWidth - menu.offsetWidth - 8);\n      const below = anchor.bottom + 4 + menu.offsetHeight < innerHeight;\n      menu.style.left = `${Math.max(8, left)}px`;\n      menu.style.top = `${below ? anchor.bottom + 4 : anchor.top - menu.offsetHeight - 4}px`;\n      menu.querySelector(\".st-menu-item\")?.focus();\n    });\n    menu.addEventListener(\"keydown\", event => {\n      const items = [...menu.querySelectorAll(\".st-menu-item\")];\n      const index = items.indexOf(document.activeElement);\n      if (event.key === \"ArrowDown\") items[(index + 1) % items.length].focus();\n      else if (event.key === \"ArrowUp\") items[(index - 1 + items.length) % items.length].focus();\n      else return;\n      event.preventDefault();\n    });\n    menu.addEventListener(\"click\", event => {\n      if (event.target.closest(\".st-menu-item\")) menu.hidePopover();\n    });\n  });\n<\/script>\n", "path": "components/patterns/menu.html", "id": "menu"}, {"name": "Metrics", "summary": "A row of compact numbers with labels that wraps to fit the pane.", "use": "Three to five key numbers at the top of a dashboard-like plugin.", "avoid": "Decorative cards, icons on every tile, trend arrows without a clear baseline.", "body": "<style>\n  .st-metrics { display: flex; flex-wrap: wrap; gap: 1px; margin: var(--space-2); border-radius: var(--radius-lg); overflow: hidden; background: var(--separator); }\n  .st-metric { flex: 1 1 110px; padding: 10px var(--space-3); background: var(--surface); }\n  .st-metric-label { font-size: var(--text-sm); color: var(--text-secondary); }\n  .st-metric-value { margin-top: 2px; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }\n  .st-metric-value small { font-size: var(--text-md); font-weight: 400; color: var(--text-secondary); }\n  .st-metric-value.is-danger { color: var(--danger); }\n<\/style>\n\n<div class=\"st-metrics\">\n  <div class=\"st-metric\"><div class=\"st-metric-label\">Requests<\/div><div class=\"st-metric-value\">1,284<\/div><\/div>\n  <div class=\"st-metric\"><div class=\"st-metric-label\">p95 latency<\/div><div class=\"st-metric-value\">182<small> ms<\/small><\/div><\/div>\n  <div class=\"st-metric\"><div class=\"st-metric-label\">Errors<\/div><div class=\"st-metric-value is-danger\">7<\/div><\/div>\n<\/div>\n", "path": "components/patterns/metrics.html", "id": "metrics"}, {"name": "Pane shell", "summary": "The default page frame: optional toolbar, one scrolling content area, optional status bar.", "use": "Start every plugin page from this. Only the content area scrolls.", "avoid": "Page-level scrolling, headers that repeat the pane title, footers with nothing live in them.", "notes": "The native pane header already shows the plugin title. Use workspace.setTitle for context, not an <h1>.", "preview-height": "260", "body": "<style>\n  .st-shell { display: flex; flex-direction: column; height: 100vh; }\n  .st-shell > .st-shell-content { flex: 1; min-height: 0; overflow: auto; }\n  .st-shell > .st-shell-toolbar,\n  .st-shell > .st-shell-status { flex: none; }\n  .st-shell-toolbar {\n    display: flex; align-items: center; gap: var(--space-2);\n    height: var(--toolbar-height); padding: 0 var(--space-2);\n    border-bottom: 1px solid var(--separator);\n  }\n  .st-shell-status {\n    display: flex; align-items: center; gap: var(--space-3);\n    height: 24px; padding: 0 var(--space-3);\n    border-top: 1px solid var(--separator);\n    color: var(--text-secondary);\n    font-size: var(--text-sm);\n  }\n<\/style>\n\n<div class=\"st-shell\">\n  <header class=\"st-shell-toolbar\">\n    <label class=\"st-search\" style=\"flex:1;max-width:260px\">\n      <svg class=\"st-icon\" viewBox=\"0 0 16 16\"><circle cx=\"7\" cy=\"7\" r=\"4.5\"/><path d=\"m10.5 10.5 3 3\"/><\/svg>\n      <input class=\"st-field\" type=\"search\" placeholder=\"Filter\" aria-label=\"Filter\">\n    <\/label>\n    <span class=\"st-spacer\"><\/span>\n    <button class=\"st-button is-icon\" aria-label=\"Refresh\" title=\"Refresh\">\n      <svg class=\"st-icon\" viewBox=\"0 0 16 16\"><path d=\"M13 8a5 5 0 1 1-1.5-3.6M13 2.5v3h-3\"/><\/svg>\n    <\/button>\n  <\/header>\n  <main class=\"st-shell-content\">\n    <\u0021-- Content: a list, table, form or detail view. -->\n    <div style=\"padding:var(--space-3);color:var(--text-secondary)\">Content scrolls here.<\/div>\n  <\/main>\n  <footer class=\"st-shell-status\">\n    <span class=\"st-numeric\">24 items<\/span>\n    <span class=\"st-spacer\"><\/span>\n    <span>Updated just now<\/span>\n  <\/footer>\n<\/div>\n", "path": "components/patterns/pane-shell.html", "id": "pane-shell"}, {"name": "Path bar", "summary": "Breadcrumb path with clickable segments that collapses middle segments into a menu when narrow.", "use": "Showing where a browser-style view is, such as a folder, a JSON key path or a nested group.", "avoid": "Primary navigation between unrelated views. More than one path bar per pane.", "notes": "Put it under the toolbar or in the status bar. The first and last segments always stay visible.", "script": "Renders segments from data-path, collapses middle segments to fit, and dispatches a navigate event.", "preview-height": "150", "preview-padding": "true", "body": "<style>\n  .st-path {\n    display: flex; align-items: center;\n    height: var(--row-height); min-width: 0;\n    font-size: var(--text-md);\n  }\n  .st-path-list { display: flex; align-items: center; min-width: 0; margin: 0; padding: 0; list-style: none; }\n  .st-path-list > li { display: flex; align-items: center; flex: none; min-width: 0; }\n  /* The first and last segments shrink with an ellipsis once the middle is collapsed. */\n  .st-path-list > li:first-child { flex: 0 1 auto; max-width: 40%; }\n  .st-path-list > li:last-child { flex: 0 1 auto; }\n  .st-path-list.is-measuring > li { flex: none; max-width: none; }\n  .st-path-list > li + li::before {\n    content: \"\"; flex: none;\n    width: 5px; height: 5px; margin: 0 6px 0 4px;\n    border: solid var(--text-tertiary); border-width: 1.5px 1.5px 0 0;\n    transform: rotate(45deg);\n  }\n  .st-path-seg {\n    min-width: 0; height: var(--control-height-sm); padding: 0 4px;\n    border: 0; border-radius: var(--radius-sm);\n    background: none; color: var(--text-secondary); font: inherit;\n    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\n  }\n  .st-path-seg:hover { background: var(--fill); color: var(--text); }\n  .st-path-seg[aria-current] { color: var(--text); font-weight: 500; }\n  .st-path-seg[aria-current]:hover { background: none; }\n\n  .st-path-menu {\n    margin: 0; padding: var(--space-1); min-width: 160px;\n    border: 0; border-radius: var(--radius-lg);\n    background: var(--surface-raised); color: var(--text);\n    box-shadow: var(--shadow-popover);\n    font-size: var(--text-base);\n  }\n  .st-path-menu button {\n    display: block; width: 100%; height: 24px; padding: 0 var(--space-2);\n    border: 0; border-radius: var(--radius-sm);\n    background: none; color: inherit; font: inherit; text-align: left;\n    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;\n  }\n  .st-path-menu button:hover, .st-path-menu button:focus-visible { background: var(--accent); color: var(--on-accent); outline: none; }\n<\/style>\n\n<nav class=\"st-path\" aria-label=\"Path\" data-path=\"~/Developer/slate-term/design-system/components/patterns\">\n  <ol class=\"st-path-list\"><\/ol>\n  <div class=\"st-path-menu\" popover role=\"menu\"><\/div>\n<\/nav>\n\n<script>\n  document.querySelectorAll(\".st-path\").forEach(nav => {\n    const list = nav.querySelector(\".st-path-list\");\n    const menu = nav.querySelector(\".st-path-menu\");\n    const more = document.createElement(\"li\");\n    more.innerHTML = '<button class=\"st-path-seg\" aria-label=\"Hidden segments\" title=\"Hidden segments\" aria-haspopup=\"menu\">\u2026<\/button>';\n    // A native popover invoker lets a second click close the menu instead of reopening it.\n    menu.id ||= `st-path-menu-${Math.random().toString(36).slice(2)}`;\n    more.firstChild.setAttribute(\"popovertarget\", menu.id);\n    let segments = [], items = [];\n\n    const button = ({ label, path }, current) => {\n      const b = document.createElement(\"button\");\n      b.className = \"st-path-seg\";\n      b.textContent = label;\n      b.title = path;\n      b.dataset.path = path;\n      if (current) b.setAttribute(\"aria-current\", \"location\");\n      return b;\n    };\n\n    function render() {\n      const parts = nav.dataset.path.split(\"/\");\n      segments = parts.map((part, i) => ({ label: part || \"/\", path: parts.slice(0, i + 1).join(\"/\") || \"/\" }))\n        .filter((s, i) => s.label !== \"/\" || i === 0);\n      items = segments.map((s, i) => {\n        const li = document.createElement(\"li\");\n        li.append(button(s, i === segments.length - 1));\n        return li;\n      });\n      list.replaceChildren(...items);\n      fit();\n    }\n\n    // Hide middle segments from the left until the natural widths fit, then show \"\u2026\" after the first.\n    function fit() {\n      items.forEach(li => li.hidden = false);\n      more.remove();\n      list.classList.add(\"is-measuring\");\n      let hidden = 0;\n      while (list.scrollWidth > nav.clientWidth && hidden < items.length - 2) {\n        items[++hidden].hidden = true;\n        if (hidden === 1) items[0].after(more);\n      }\n      list.classList.remove(\"is-measuring\");\n    }\n\n    nav.addEventListener(\"click\", event => {\n      const target = event.target.closest(\"button\");\n      if (!target || target.hasAttribute(\"aria-current\")) return;\n      if (more.contains(target)) return;\n      if (menu.matches(\":popover-open\")) menu.hidePopover();\n      nav.dispatchEvent(new CustomEvent(\"navigate\", { detail: { path: target.dataset.path }, bubbles: true }));\n    });\n    menu.addEventListener(\"beforetoggle\", event => {\n      if (event.newState !== \"open\") return;\n      menu.replaceChildren(...segments.filter((_, i) => items[i].hidden).map(s => {\n        const item = button(s);\n        item.className = \"\";\n        item.setAttribute(\"role\", \"menuitem\");\n        return item;\n      }));\n    });\n    menu.addEventListener(\"toggle\", event => {\n      if (event.newState !== \"open\") return;\n      const anchor = more.getBoundingClientRect();\n      menu.style.left = `${Math.max(8, Math.min(anchor.left, innerWidth - menu.offsetWidth - 8))}px`;\n      menu.style.top = `${anchor.bottom + 4}px`;\n      menu.querySelector(\"button\")?.focus();\n    });\n    menu.addEventListener(\"keydown\", event => {\n      const items = [...menu.querySelectorAll(\"button\")];\n      const index = items.indexOf(document.activeElement);\n      if (event.key === \"ArrowDown\") items[(index + 1) % items.length].focus();\n      else if (event.key === \"ArrowUp\") items[(index - 1 + items.length) % items.length].focus();\n      else return;\n      event.preventDefault();\n    });\n\n    new ResizeObserver(fit).observe(nav);\n    nav.render = render;\n    render();\n  });\n\n  // Demo only: a real plugin loads the new location, then sets data-path and calls render().\n  document.querySelectorAll(\".st-path\").forEach(nav => nav.addEventListener(\"navigate\", event => {\n    nav.dataset.path = event.detail.path;\n    nav.render();\n  }));\n<\/script>\n", "path": "components/patterns/path-bar.html", "id": "path-bar"}, {"name": "Search results", "summary": "Matches grouped by file, each a line number and a one-line snippet with the match highlighted.", "use": "Text search across files, symbols or logs, and any filter that should show why an item matched.", "avoid": "Multi-line snippets. Bold or recolored matches that shift the text; use mark.", "notes": "Clip the snippet so the match stays visible: keep a few characters before it and add a leading ellipsis.", "script": "highlight(text, query) builds a safe snippet with mark; Return on a row dispatches \"open\".", "body": "<style>\n  .st-results { padding: var(--space-1); }\n  .st-results-file {\n    display: flex; align-items: center; gap: 6px;\n    height: var(--row-height); padding: 0 10px;\n    font-weight: 600; font-size: var(--text-md);\n  }\n  .st-results-file > .st-icon { color: var(--text-secondary); }\n  .st-results-path { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n  .st-results-path span { font-weight: 400; color: var(--text-tertiary); }\n  .st-results-count { margin-left: auto; font-weight: 400; color: var(--text-tertiary); font-size: var(--text-sm); }\n  .st-results-match {\n    display: flex; align-items: baseline; gap: 10px;\n    height: 24px; padding: 0 10px 0 32px;\n    border-radius: var(--radius);\n    font: var(--st-font-mono-size)/24px var(--font-mono);\n  }\n  .st-results-match:hover { background: var(--fill); }\n  .st-results-match[aria-selected=\"true\"] { background: var(--accent-tint); }\n  .st-results-line { flex: none; min-width: 3ch; text-align: right; color: var(--text-tertiary); }\n  .st-results-snippet { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-secondary); }\n  .st-results-snippet mark { color: var(--text); }\n<\/style>\n\n<div class=\"st-results\" role=\"listbox\" tabindex=\"0\" aria-label=\"Search results\">\n  <div class=\"st-results-file\">\n    <svg class=\"st-icon\" viewBox=\"0 0 16 16\"><path d=\"M4 2h5l3 3v9H4z\"/><path d=\"M9 2v3h3\"/><\/svg>\n    <span class=\"st-results-path\">theme.ts <span>src/plugins<\/span><\/span>\n    <span class=\"st-results-count st-numeric\">2<\/span>\n  <\/div>\n  <div class=\"st-results-match\" role=\"option\" aria-selected=\"true\" data-text=\"export function applyPalette(palette: Palette) {\" data-line=\"14\"><\/div>\n  <div class=\"st-results-match\" role=\"option\" aria-selected=\"false\" data-text=\"  window.workspace.subscribe(() => applyPalette(read()), { topics: [&quot;host.appearance.changed&quot;] });\" data-line=\"41\"><\/div>\n  <div class=\"st-results-file\">\n    <svg class=\"st-icon\" viewBox=\"0 0 16 16\"><path d=\"M4 2h5l3 3v9H4z\"/><path d=\"M9 2v3h3\"/><\/svg>\n    <span class=\"st-results-path\">README.md <span>docs<\/span><\/span>\n    <span class=\"st-results-count st-numeric\">1<\/span>\n  <\/div>\n  <div class=\"st-results-match\" role=\"option\" aria-selected=\"false\" data-text=\"Call applyPalette once at startup, then on every change event.\" data-line=\"7\"><\/div>\n<\/div>\n\n<script>\n  // Escapes text and wraps every case-insensitive match in mark.\n  // Long lines start shortly before the first match so it stays in view.\n  function highlight(text, query, lead = 16) {\n    const escape = value => value.replace(/[&<>\"]/g, c => `&#${c.charCodeAt(0)};`);\n    const at = query ? text.toLowerCase().indexOf(query.toLowerCase()) : -1;\n    if (at < 0) return escape(text);\n    const start = at > lead ? at - lead : 0;\n    const shown = (start ? \"\u2026\" : \"\") + text.slice(start).trimStart();\n    const pattern = new RegExp(query.replace(/[.*+?^${}()|[\\]\\\\]/g, \"\\\\$&\"), \"gi\");\n    let html = \"\", last = 0;\n    for (const match of shown.matchAll(pattern)) {\n      html += escape(shown.slice(last, match.index)) + `<mark>${escape(match[0])}<\/mark>`;\n      last = match.index + match[0].length;\n    }\n    return html + escape(shown.slice(last));\n  }\n\n  document.querySelectorAll(\".st-results\").forEach((results, listIndex) => {\n    const query = \"applyPalette\";\n    const rows = () => [...results.querySelectorAll(\"[role=option]\")];\n    rows().forEach(row => {\n      row.innerHTML = `<span class=\"st-results-line st-numeric\">${row.dataset.line}<\/span><span class=\"st-results-snippet\">${highlight(row.dataset.text, query)}<\/span>`;\n    });\n    rows().forEach((row, index) => row.id ||= `st-results-${listIndex}-${index}`);\n    const select = row => {\n      rows().forEach(other => other.setAttribute(\"aria-selected\", String(other === row)));\n      results.setAttribute(\"aria-activedescendant\", row.id);\n      row.scrollIntoView({ block: \"nearest\" });\n    };\n    results.addEventListener(\"click\", event => {\n      const row = event.target.closest(\"[role=option]\");\n      if (row) select(row);\n    });\n    results.addEventListener(\"keydown\", event => {\n      const all = rows();\n      const index = all.findIndex(row => row.getAttribute(\"aria-selected\") === \"true\");\n      if (event.key === \"ArrowDown\") select(all[Math.min(index + 1, all.length - 1)]);\n      else if (event.key === \"ArrowUp\") select(all[Math.max(index - 1, 0)]);\n      else if (event.key === \"Enter\") all[index]?.dispatchEvent(new CustomEvent(\"open\", { bubbles: true }));\n      else return;\n      event.preventDefault();\n    });\n  });\n<\/script>\n", "path": "components/patterns/search-results.html", "id": "search-results"}, {"name": "Grouped section", "summary": "macOS-style inset groups of label/control rows for settings and forms.", "use": "Settings, configuration forms and short property lists.", "avoid": "Nesting groups, explanatory paragraphs above each group, or one group per field.", "notes": "Put a short caption under a row only when the label alone is ambiguous.", "body": "<style>\n  .st-form { display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-3); }\n  .st-group-label { padding: 0 var(--space-2) 6px; font-size: var(--text-sm); font-weight: 600; color: var(--text-secondary); }\n  .st-group {\n    border-radius: var(--radius-lg);\n    background: var(--surface);\n    box-shadow: inset 0 0 0 1px var(--separator);\n  }\n  .st-group-row {\n    display: flex; align-items: center; gap: var(--space-3);\n    min-height: 36px; padding: 6px var(--space-3);\n  }\n  .st-group-row + .st-group-row { border-top: 1px solid var(--separator); }\n  .st-group-row > label:first-child, .st       <\/div>\n    <\/section>\n  <\/div>\n<\/div>\n\n<script>\n  document.querySelectorAll(\".st-grouped\").forEach(root => {\n    const lists = () => [...root.querySelectorAll(\".st-grouped-rows\")];\n    const rows = () => lists().filter(list => !list.hidden).flatMap(list => [...list.querySelectorAll(\"[role=option]\")]);\n    // One tab stop: the open list holding the selection, or else the first open list.\n    const syncTabStop = () => {\n      const open = lists().filter(list => !list.hidden);\n      const stop = open.find(list => list.querySelector(\"[aria-selected=true]\")) ?? open[0];\n      lists().forEach(list => { list.tabIndex = list === stop ? 0 : -1; });\n      return stop;\n    };\n    const select = row => {\n      root.querySelectorAll(\"[role=option]\").forEach(other => other.setAttribute(\"aria-selected\", String(other === row)));\n      const stop = syncTabStop();\n      if (root.contains(document.activeElement) && document.activeElement !== stop) stop.focus();\n      row.scrollIntoView({ block: \"nearest\" });\n    };\n\n    root.addEventListener(\"click\", event => {\n      const toggle = event.target.closest(\".st-grouped-toggle\");\n      if (toggle) {\n        const open = toggle.getAttribute(\"aria-expanded\") !== \"true\";\n        toggle.setAttribute(\"aria-expanded\", String(open));\n        document.getElementById(toggle.getAttribute(\"aria-controls\")).hidden = !open;\n        syncTabStop();\n        return;\n      }\n      const row = event.target.closest(\"[role=option]\");\n      if (row) select(row);\n    });\n\n    root.addEventListener(\"keydown\", event => {\n      if (!event.target.matches(\".st-grouped-rows\")) return;\n      const all = rows();\n      if (!all.length) return;\n      const index = all.findIndex(row => row.getAttribute(\"aria-selected\") === \"true\");\n      if (event.key === \"ArrowDown\") select(all[Math.min(index + 1, all.length - 1)]);\n      else if (event.key === \"ArrowUp\") select(all[Math.max(index - 1, 0)]);\n      else if (event.key === \"Enter\") all[index]?.dispatchEvent(new CustomEvent(\"open\", { bubbles: true }));\n      else return;\n      event.preventDefault();\n    });\n  });\n<\/script>\n", "path": "components/patterns/sectioned-list.html", "id": "sectioned-list"}, {"name": "Table", "summary": "Dense rows with a sticky header, aligned numeric columns and row selection.", "use": "Comparing several fields across many items: processes, test results, dependencies.", "avoid": "Fewer than three columns (use List). Zebra stripes, vertical rules, or wrapping cell text.", "notes": "Right-align numbers and use tabular figures. Drop low-value columns at narrow widths.", "body": "<style>\n  .st-table-wrap { container-type: inline-size; }\n  .st-table { width: 100%; border-collapse: collapse; font-size: var(--text-md); }\n  .st-table th {\n    position: sticky; top: 0; z-index: 1;\n    height: 26px; padding: 0 var(--space-3);\n    background: var(--bg);\n    border-bottom: 1px solid var(--separator);\n    color: var(--text-secondary);\n    font-size: var(--text-sm); font-weight: 500; text-align: left; white-space: nowrap;\n  }\n  .st-table td {\n    height: var(--row-height); padding: 0 var(--space-3);\n    border-bottom: 1px solid color-mix(in oklab, var(--st-fg) 6%, transparent);\n    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 0;\n  }\n  .st-table .is-numeric { text-align: right; font-variant-numeric: tabular-nums; }\n  .st-table .is-mono { font-family: var(--font-mono); font-size: var(--st-font-mono-size); }\n  .st-table tbody tr:hover { background: var(--fill); }\n  .st-table tbody tr[aria-current=\"true\"] { background: var(--accent-tint); }\n  @container (max-width: 420px) { .st-table .is-optional { display: none; } }\n<\/style>\n\n<div class=\"st-table-wrap\">\n  <table class=\"st-table\">\n    <thead>\n      <tr><th style=\"width:44%\">Process<\/th><th class=\"is-optional\">User<\/th><th class=\"is-numeric\">CPU<\/th><th pen\". Keep keyboard support when adapting.", "body": "<style>\n  .st-outline { --st-outline-indent: 14px; display: flex; flex-direction: column; padding: var(--space-1); outline: none; }\n  .st-outline [role=group] { display: flex; flex-direction: column; }\n  .st-outline [aria-expanded=\"false\"] > [role=group] { display: none; }\n  .st-outline-row {\n    --st-outline-depth: 0;\n    display: flex; align-items: center; gap: 6px;\n    height: var(--row-height);\n    padding: 0 10px 0 calc(4px + var(--st-outline-depth) * var(--st-outline-indent));\n    border-radius: var(--radius);\n  }\n  .st-outline [aria-level=\"2\"] > .st-outline-row { --st-outline-depth: 1; }\n  .st-outline [aria-level=\"3\"] > .st-outline-row { --st-outline-depth: 2; }\n  .st-outline [aria-level=\"4\"] > .st-outline-row { --st-outline-depth: 3; }\n  .st-outline [aria-level=\"5\"] > .st-outline-row { --st-outline-depth: 4; }\n  .st-outline-row:hover { background: var(--fill); }\n  [aria-selected=\"true\"] > .st-outline-row { background: var(--accent-tint); }\n  .st-outline:focus-visible [aria-selected=\"true\"] > .st-outline-row { box-shadow: inset 0 0 0 1px var(--focus-ring); }\n  .st-outline-toggle {\n    display: grid; place-items: center; flex: none;\n    width: 14px; height: 14px;\n    color: var(--text-tertiary);\n  }\n  .st-outline-toggle .st-icon { width: 10px; height: 10px; stroke-width: 2; transition: transform 120ms var(--ease-out); }\n  [aria-expanded=\"true\"] > .st-outline-row .st-outline-toggle .st-icon { transform: rotate(90deg); }\n  .st-outline-row > .st-icon { color: var(--text-secondary); }\n  [aria-selected=\"true\"] > .st-outline-row > .st-icon { color: var(--accent); }\n  .st-outline-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n  .st-outline-trailing { flex: none; font-size: var(--text-sm); color: var(--text-tertiary); font-variant-numeric: tabular-nums; }\n  .st-outline-trailing.is-modified { color: var(--warning); font-weight: 600; }\n  .st-outline-trailing.is-added { color: var(--success); font-weight: 600; }\n<\/style>\n\n<div class=\"st-outline\" role=\"tree\" tabindex=\"0\" aria-label=\"Files\">\n  <div role=\"treeitem\" aria-level=\"1\" aria-expanded=\"true\" aria-selected=\"false\">\n    <div class=\"st-outline-row\">\n      <span class=\"st-outline-toggle\"><svg class=\"st-icon\" viewBox=\"0 0 10 10\"><path d=\"m3.5 2 3 3-3 3\"/><\/svg><\/span>\n      <svg class=\"st-icon\" viewBox=\"0 0 16 16\"><path d=\"M2 4.5c0-.6.4-1 1-1h3l1.5 1.5H13c.6 0 1 .4 1 1V12c0 .6-.4 1-1 1H3c-.6 0-1-.4-1-1z\"/><\/svg>\n      <span class=\"st-outline-name\">Sources<\/span>\n      <span class=\"st-outline-trailing\">4<\/span>\n    <\/div>\n    <div role=\"group\">\n      <div role=\"treeitem\" aria-level=\"2\" aria-expanded=\"true\" aria-selected=\"false\">\n        <div class=\"st-outline-row\">\n          <span class=\"st-outline-toggle\"><svg class=\"st-icon\" viewBox=\"0 0 10 10\"><path d=\"m3.5 2 3 3-3 3\"/><\/svg><\/span>\n          <svg class=\"st-icon\" viewBox=\"0 0 16 16\"><path d=\"M2 4.5c0-.6.4-1 1-1h3l1.5 1.5H13c.6 0 1 .4 1 1V12c0 .6-.4 1-1 1H3c-.6 0-1-.4-1-1z\"/><\/svg>\n          <span class=\"st-outline-name\">Panes<\/span>\n          <span class=\"st-outline-trailing\">2<\/span>\n        <\/div>\n        <div role=\"group\">\n          <div role=\"treeitem\" aria-level=\"3\" aria-selected=\"true\">\n            <div class=\"st-outline-row\">\n              <span class=\"st-outline-toggle\"><\/span>\n              <svg class=\"st-icon\" viewBox=\"0 0 16 16\"><path d=\"M4 2h5l3 3v9H4zM9 2v3h3\"/><\/svg>\n              <span class=\"st-outline-name\">PaneSplitController.swift<\/span>\n              <span class=\"st-outline-trailing is-modified\" title=\"Modified\">M<\/span>\n            <\/div>\n          <\/div>\n          <div role=\"treeitem\" aria-level=\"3\" aria-selected=\"false\">\n            <div class=\"st-outline-row\">\n              <span class=\"st-outline-toggle\"><\/s const $ = (selector, root = document) => root.querySelector(selector);
const el = (tag, attrs = {}, ...children) => {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key === "text") node.textContent = value;
    else if (key === "html") node.innerHTML = value;
    else node.setAttribute(key, value);
  }
  node.append(...children.filter(Boolean));
  return node;
};
const store = {
  get(key) { try { return localStorage.getItem(key); } catch { return null; } },
  set(key, value) { try { localStorage.setItem(key, value); } catch {} },
};

/* ---------- Palette ---------- */

const LIVE = "Terminal (live)";
const workspace = window.workspace;
const hasLiveTheme = !!(workspace && Array.isArray(workspace.methods) && workspace.methods.includes("appearance.get"));
let liveTheme = null;
let current = null;

function paletteVars(theme) {
  const p = theme.palette;
  const vars = {
    "--st-bg": p.background, "--st-fg": p.foreground, "--st-cursor": p.cursor,
    "--st-selection-bg": p.selectionBackground || p.foreground, "--st-selection-fg": p.selectionForeground || p.background,
  };
  p.ansi.forEach((color, index) => { if (color) vars[`--st-ansi-${index}`] = color; });
  if (theme.font) vars["--st-font-mono"] = `"${theme.font.family}", ui-monospace, Menlo, monospace`;
  return vars;
}

function applyTo(doc, theme) {
  const root = doc.documentElement;
  for (const [name, value] of Object.entries(paletteVars(theme))) root.style.setProperty(name, value);
  root.dataset.appearance = theme.tone;
  root.style.colorScheme = theme.tone;
}

function applyTheme(theme) {
  current = theme;
  applyTo(document, theme);
  // Native pane chrome follows macOS, not the palette, so mimic its neutral grays.
  const dark = theme.tone === "dark";
  const chrome = dark
    ? { "--chrome-bg": "#262628", "--chrome-text": "#e8e8ea", "--chrome-secondary": "#a2a2a8", "--chrome-line": "#00000080" }
    : { "--chrome-bg": "#ececee", "--chrome-text": "#262628", "--chrome-secondary": "#6e6e74", "--chrome-line": "#00000018" };
  for (const [name, value] of Object.entries(chrome)) document.documentElement.style.setProperty(name, value);
  $("#appearance").textContent = theme.tone;
  document.querySelectorAll("iframe").forEach(frame => { if (frame.contentDocument) applyTo(frame.contentDocument, theme); });
}

function selectPalette(name) {
  store.set("slate-gallery-palette", name);
  if (name === LIVE) {
    if (liveTheme) applyTheme(liveTheme);
    return;
  }
  const entry = DATA.palettes.find(p => p.name === name) || DATA.palettes[0];
  applyTheme({ tone: entry.mode, palette: entry.palette });
}

const select = $("#palette");
if (hasLiveTheme) select.append(el("option", { text: LIVE }));
for (const tone of ["dark", "light"]) {
  const group = el("optgroup", { label: tone === "dark" ? "Dark palettes" : "Light palettes" });
  DATA.palettes.filter(p => p.mode === tone).forEach(p => group.append(el("option", { text: p.name })));
  select.append(group);
}
const systemDefault = matchMedia("(prefers-color-scheme: light)").matches ? "Builtin Light" : "Builtin Dark";
select.value = store.get("slate-gallery-palette") || (hasLiveTheme ? LIVE : systemDefault);
if (!select.value) select.value = systemDefault;
select.addEventListener("change", () => selectPalette(select.value));

if (hasLiveTheme) {
  const readLive = () => workspace.call("appearance.get").then(theme => {
    liveTheme = theme;
    if (select.value === LIVE) applyTheme(theme);
  });
  workspace.subscribe(() => readLive().catch(() => {}), { topics: ["host.appearance.changed"], onError: () => readLive().catch(() => {}) });
  readLive().catch(() => {});
}

/* ---------- Code display ---------- */

function highlight(source) {
  return html(source)
    .replace(/(&lt;!--[\s\S]*?--&gt;|\/\*[\s\S]*?\*\/)/g, '<span class="tok-c">$1</span>')
    .replace(/(&lt;\/?)([a-z][\w-]*)/g, '$1<span class="tok-t">$2</span>')
    .replace(/ ([a-z-]+)=(&quot;)/g, ' <span class="tok-a">$1</span>=$2');
}
function html(text) {
  return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function codeBlock(source, label) {
  const copy = el("button", { class: "st-button is-small", text: "Copy" });
  copy.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(source); copy.textContent = "Copied"; }
    catch { copy.textContent = "Copy failed"; }
    setTimeout(() => { copy.textContent = "Copy"; }, 1200);
  });
  return el("details", { class: "code" },
    el("summary", { html: `<svg class="st-icon" viewBox="0 0 16 16" style="width:12px;height:12px"><path d="m5.5 4-4 4 4 4M10.5 4l4 4-4 4"/></svg>${label}` }),
    el("div", { class: "code-box" }, el("pre", { html: highlight(source) }), copy));
}

/* ---------- Previews ---------- */

let frameWidth = store.get("slate-gallery-width") || "560px";

function previewDocument(component) {
  const padded = component.path.startsWith("components/controls/") || component["preview-padding"] === "true";
  const vars = Object.entries(paletteVars(current)).map(([k, v]) => `${k}:${v}`).join(";");
  const fixed = component["preview-height"];
  return `<!doctype html><html data-appearance="${current.tone}" style="${vars};color-scheme:${current.tone}"><head><meta charset="utf-8">
<style>${DATA.setup["slate.css"].replace(/<\//g, "<\\/")}</style>
<style>${fixed ? `body{overflow:hidden}.st-shell{height:${fixed}px}` : "html,body{height:auto}body{overflow:hidden;display:flow-root}"}${padded ? "body{padding:16px}" : ""}</style>
</head><body>${component.body}</body></html>`;
}

function preview(component) {
  const frame = el("iframe", { title: `${component.name} preview`, loading: "lazy" });
  frame.srcdoc = previewDocument(component);
  const fixed = Number(component["preview-height"]) || 0;
  frame.addEventListener("load", () => {
    const doc = frame.contentDocument;
    applyTo(doc, current);
    // Measure the body, because html fills the iframe and never shrinks.
    const fit = () => { frame.style.height = `${fixed || Math.max(48, Math.min(560, Math.ceil(doc.body.getBoundingClientRect().height)))}px`; };
    fit();
    if (!fixed) new ResizeObserver(fit).observe(doc.body);
  });
  const wrapper = el("div", { class: "frame" },
    el("div", { class: "pane-header", html: `<b>Plugin<svg viewBox="0 0 10 10"><path d="M2.5 4l2.5 2.5L7.5 4"/></svg></b><span>${html(component.name)}</span><span>✕</span>` }),
    frame);
  return wrapper;
}

function applyWidth() {
  document.querySelectorAll(".frame").forEach(frame => {
    frame.style.width = "";
    frame.classList.toggle("is-full", frameWidth === "100%");
    frame.style.setProperty("--frame-width", frameWidth);
  });
  document.querySelectorAll("#widths button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.width === frameWidth)));
}
$("#widths").addEventListener("click", event => {
  const button = event.target.closest("button");
  if (!button) return;
  frameWidth = button.dataset.width;
  store.set("slate-gallery-width", frameWidth);
  applyWidth();
});

/* ---------- Page ---------- */

const content = $("#content");
const nav = $("#nav");

function navLink(id, label) { return el("a", { href: `#${id}`, text: label, "data-target": id }); }

function foundations() {
  nav.append(el("h3", { text: "Foundations" }), navLink("colors", "Colors"), navLink("type", "Type"), navLink("setup", "Setup"));
  content.append(el("div", { class: "group-title", text: "Foundations" }));

  const tokens = ["bg", "surface", "surface-raised", "fill", "separator", "border", "text", "text-secondary", "text-tertiary", "accent", "accent-tint", "success", "warning", "danger", "info"];
  const swatches = el("div", { class: "swatches" }, ...tokens.map(name =>
    el("div", { class: "swatch" }, el("i", { style: `background:var(--${name})` }), el("div", {}, el("div", { text: name }), el("code", { text: `var(--${name})` })))));
  const ansi = el("div", { class: "ansi" }, ...Array.from({ length: 16 }, (_, i) => el("i", { style: `background:var(--st-ansi-${i})`, title: `--st-ansi-${i}` })));
  content.append(el("section", { class: "entry", id: "colors" },
    el("div", { class: "entry-head" }, el("h2", { text: "Colors" })),
    el("p", { class: "entry-summary", text: "Semantic tokens derived from the terminal palette. Switch palettes above to see them adapt." }),
    swatches,
    el("p", { class: "entry-summary", style: "margin-top:18px", text: "Raw ANSI 0–15 input (--st-ansi-N). Status hues come from 1, 2, 3, 4 and 6 with lightness clamped for contrast." }),
    ansi));

  const scale = [["--text-lg / 600", "font-size:var(--text-lg);font-weight:600", "Pane heading"], ["--text-base", "font-size:var(--text-base)", "Body and row titles"], ["--text-md", "font-size:var(--text-md)", "Controls and secondary text"], ["--text-sm", "font-size:var(--text-sm);color:var(--text-secondary)", "Captions, metadata"], ["--font-mono", "font-family:var(--font-mono);font-size:var(--st-font-mono-size)", "npm run dev -- --port 5173"]];
  content.append(el("section", { class: "entry", id: "type" },
    el("div", { class: "entry-head" }, el("h2", { text: "Type" })),
    el("p", { class: "entry-summary", text: "System font at macOS sizes for UI; the terminal font for code and data." }),
    el("div", { class: "type-scale" }, ...scale.map(([label, style, sample]) => el("div", {}, el("code", { text: label }), el("span", { style, text: sample }))))));

  content.append(el("section", { class: "entry", id: "setup" },
    el("div", { class: "entry-head" }, el("h2", { text: "Setup" })),
    el("p", { class: "entry-summary", text: "Copy both files into the plugin. Load slate-theme.js before slate.css in <head>." }),
    codeBlock(DATA.setup["slate-theme.js"], "slate-theme.js"),
    codeBlock(DATA.setup["slate.css"], "slate.css")));
}

function components() {
  for (const group of DATA.groups) {
    if (!group.items.length) continue;
    nav.append(el("h3", { text: group.title }));
    content.append(el("div", { class: "group-title", text: group.title }));
    for (const c of group.items) {
      nav.append(navLink(c.id, c.name));
      const guidance = el("dl", { class: "guidance" },
        el("dt", { text: "Use" }), el("dd", { text: c.use }),
        el("dt", { text: "Avoid" }), el("dd", { text: c.avoid }));
      if (c.notes) guidance.append(el("dt", { text: "Notes" }), el("dd", { text: c.notes }));
      content.append(el("section", { class: "entry", id: c.id },
        el("div", { class: "entry-head" }, el("h2", { text: c.name }), el("code", { text: c.path })),
        el("p", { class: "entry-summary", text: c.summary }),
        guidance,
        preview(c),
        codeBlock(c.body, c.styles === "slate.css" ? "Markup (styles in slate.css)" : "Code")));
    }
  }
}

selectPalette(select.value);
foundations();
components();
applyWidth();

// Highlight the section in view.
const links = [...nav.querySelectorAll("a")];
const observer = new IntersectionObserver(entries => {
  for (const entry of entries) {
    if (!entry.isIntersecting) continue;
    links.forEach(link => link.setAttribute("aria-current", String(link.dataset.target === entry.target.id)));
  }
}, { root: $("#scroll"), rootMargin: "0px 0px -70% 0px" });
document.querySelectorAll(".entry").forEach(section => observer.observe(section));
</script>
