<!--
name: Keyboard hint
summary: Shortcut keys shown beside an action or in a footer.
use: Shortcuts the plugin actually handles, in menus and footers.
avoid: Shortcut hints in body text; listing shortcuts the page does not implement.
styles: slate.css
-->
<div style="display:flex;gap:16px;align-items:center;font-size:12px;color:var(--text-secondary)">
  <span style="display:inline-flex;gap:6px;align-items:center"><span style="display:inline-flex;gap:2px"><kbd class="st-kbd">⌘</kbd><kbd class="st-kbd">R</kbd></span>Refresh</span>
  <span style="display:inline-flex;gap:6px;align-items:center"><span style="display:inline-flex;gap:2px"><kbd class="st-kbd">↑</kbd><kbd class="st-kbd">↓</kbd></span>Navigate</span>
  <span style="display:inline-flex;gap:6px;align-items:center"><span style="display:inline-flex;gap:2px"><kbd class="st-kbd">↩</kbd></span>Open</span>
</div>
