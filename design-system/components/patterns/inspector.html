<!--
name: Inspector
summary: Key-value details for one item, in label and value columns.
use: Showing properties of a selected item: IDs, paths, timestamps, sizes.
avoid: Editing many fields here (use Grouped section). Labels longer than the values.
-->
<style>
  .st-inspector { display: grid; grid-template-columns: max-content 1fr; gap: 6px var(--space-4); padding: var(--space-3); font-size: var(--text-md); }
  .st-inspector dt { color: var(--text-secondary); }
  .st-inspector dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .st-inspector dd.is-mono { font-family: var(--font-mono); font-size: var(--st-font-mono-size); }
  .st-inspector-section { grid-column: 1 / -1; margin-top: var(--space-2); padding-top: var(--space-2); border-top: 1px solid var(--separator); }
</style>

<dl class="st-inspector">
  <dt>Status</dt><dd><span class="st-badge is-success">running</span></dd>
  <dt>PID</dt><dd class="is-mono">48213</dd>
  <dt>Directory</dt><dd class="is-mono">~/Developer/slate-term</dd>
  <dt>Started</dt><dd>Today at 14:02</dd>
  <dt class="st-inspector-section" aria-hidden="true"></dt>
  <dt>Command</dt><dd class="is-mono">npm run dev -- --port 5173</dd>
</dl>
